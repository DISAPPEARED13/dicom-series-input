[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-series-input"
version = "0.1.0"
description = "Collect local DICOM file paths by SeriesInstanceUID."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydicom>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
